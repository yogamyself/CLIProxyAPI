services:
  cli-proxy-api:
    image: '${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}'
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: '${VERSION:-dev}'
        COMMIT: '${COMMIT:-none}'
        BUILD_DATE: '${BUILD_DATE:-unknown}'
    container_name: cli-proxy-api
    environment:
      DEPLOY: '${DEPLOY:-}'
    ports:
      - '8317:8317'
      - '8085:8085'
      - '1455:1455'
      - '54545:54545'
      - '51121:51121'
      - '11451:11451'
    volumes:
      - '${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml'
      - '${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api'
      - '${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs'
    restart: unless-stopped
  cpa-usage-keeper:
    image: '${KEEPER_IMAGE:-ghcr.io/willxup/cpa-usage-keeper:latest}'
    pull_policy: always
    container_name: cpa-usage-keeper
    depends_on:
      - cli-proxy-api
    ports:
      - '${KEEPER_PORT:-8080}:8080'
    environment:
      TZ: '${TZ:-Asia/Jakarta}'
      CPA_BASE_URL: 'http://20.212.28.185:8317'
      CPA_MANAGEMENT_KEY: '${CPA_MANAGEMENT_KEY:?set CPA_MANAGEMENT_KEY in your env}'
      REDIS_QUEUE_ADDR: '20.212.28.185:8317'
      AUTH_ENABLED: 'true'
      LOGIN_PASSWORD: '${KEEPER_LOGIN_PASSWORD:?set KEEPER_LOGIN_PASSWORD in your env}'
      BACKUP_ENABLED: 'true'
      BACKUP_INTERVAL: 24h
      BACKUP_RETENTION_DAYS: '7'
    volumes:
      - '${KEEPER_DATA_PATH:-./keeper}:/data'
    restart: unless-stopped
